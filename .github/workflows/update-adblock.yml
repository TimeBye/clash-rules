name: Update Mihomo adblock rules

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-adblock-own
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: own

      - name: Download AdGuard DNS rules
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/abclq/home-dns-adblock/refs/heads/main/dist/adguard-dns-full.txt' \
            --output "$RUNNER_TEMP/adguard-dns-full.txt"

      - name: Convert to Mihomo classical rules
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path(os.environ['RUNNER_TEMP']) / 'adguard-dns-full.txt'
          domains = set()
          for number, line in enumerate(source.read_text(encoding='utf-8-sig').splitlines(), 1):
              line = line.strip()
              if not line or line.startswith(('!', '#')):
                  continue
              match = re.fullmatch(r'\|\|([A-Za-z0-9_\-]+(?:\.[A-Za-z0-9_\-]+)*)\^', line)
              if not match:
                  raise ValueError(f'Unsupported upstream rule at line {number}: {line}')
              domains.add(match.group(1).lower())

          if not domains:
              raise ValueError('Upstream contains no supported rules')

          content = 'payload:\n' + ''.join(
              f'  - DOMAIN-SUFFIX,{domain}\n' for domain in sorted(domains)
          )
          Path('adblock.txt').write_text(content, encoding='utf-8')
          print(f'Converted {len(domains)} rules')
          PY

      - name: Commit and push if changed
        run: |
          git add -- adblock.txt
          if git diff --cached --quiet -- adblock.txt; then
            echo 'No rule changes; skipping commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update Mihomo adblock rules ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push origin HEAD:own
